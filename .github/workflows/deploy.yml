name: Build and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:
  # rebuild every 3 hours so new YouTube videos and blog articles appear on their own
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build.py
      # GitHub pauses scheduled workflows after 60 days without commits; re-enabling keeps the schedule alive
      - name: Keep schedule alive
        if: github.event_name == 'schedule'
        run: gh workflow enable deploy.yml --repo "$GITHUB_REPOSITORY" || true
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
